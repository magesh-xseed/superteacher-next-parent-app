<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/superteacher-next-parent-app/app/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SuperTeacher Next parent app prototype.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="universal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SuperTeacher Next · Parent app</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "2293740788";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <style>
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; transition: opacity .3s; z-index: 10; }
    #boot div { display: grid; justify-items: center; gap: 22px; }
    #boot img { width: min(280px, 70vw); height: auto; }
    #boot i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #f3d6d6; border-top-color: #CA0000; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="boot" role="status" aria-label="Loading the parent app"><div><img src="assets/assets/common/images/logo.webp" alt=""><i></i></div></div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const b = document.getElementById('boot'); b.style.opacity = 0; setTimeout(() => b.remove(), 320);
    });
  </script>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      // Prototype: no service worker, so every visit gets the latest build.
      navigator.serviceWorker?.getRegistrations?.().then((rs) => rs.forEach((r) => r.unregister()));
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({canvasKitBaseUrl: "canvaskit/", useColorEmoji: true}).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
